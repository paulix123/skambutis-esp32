[platformio]
; 0 fazei: testiniai garsai trumpais vardais (LittleFS vardas <= 63 simb.): pio run -t uploadfs
data_dir = data

[env:s3]
; Arduino core 3.x (oficiali espressif32 platforma vis dar 2.x, o audio bibliotekai reikia 3.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; N16R8: 16 MB QIO flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=1  ; audio biblioteka reikalauja, 1 = tik klaidos
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7
